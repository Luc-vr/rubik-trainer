<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Leer en train F2L, OLL en PLL voor de 3x3 kubus." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>CFOP-trainer</title>
    <script>
      // Thema vóór de eerste render toepassen (geen witte flits). Zie src/lib/theme.ts.
      try {
        var t = (JSON.parse(localStorage.getItem('cfop-trainer:settings') || '{}') || {}).theme
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
