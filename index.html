<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Leer en train F2L, OLL en PLL voor de 3x3 kubus." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>CFOP-trainer</title>
    <script>
      // Thema en taal vóór de eerste render toepassen (geen witte flits).
      // Zie src/lib/theme.ts en src/lib/locale.ts.
      try {
        var s = JSON.parse(localStorage.getItem('cfop-trainer:settings') || '{}') || {}
        var t = s.theme
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
        var l = s.locale === 'nl' || s.locale === 'en' ? s.locale : /^nl\b/i.test(navigator.language || '') ? 'nl' : 'en'
        document.documentElement.lang = l
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
